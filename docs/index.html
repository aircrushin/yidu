<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta name="description" content="《已读》1.1.0 —— 一段需要你动手参与，而不是只替主角选台词的关系。六章、18 幕、四种结局的原创互动绘本叙事游戏。">
		<title>已读 · 原创互动绘本 (v1.1.0)</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #55545b;
	background-color: #f5f1e8;
	overflow: hidden;
	touch-action: none;
	font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	background-color: #f5f1e8;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 14px;
	visibility: hidden;
	z-index: 10;
}

#status-title {
	font-size: 42px;
	font-weight: 500;
	letter-spacing: 0.14em;
	color: #55545b;
	margin-bottom: 2px;
	font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
}

#status-subtitle {
	font-size: 14px;
	color: #7b7980;
	letter-spacing: 0.05em;
	margin-bottom: 12px;
}

#status-progress-wrap {
	width: min(360px, 72vw);
	height: 6px;
	background-color: #e2ddd0;
	border-radius: 999px;
	overflow: hidden;
	display: none;
}

#status-progress-bar {
	height: 100%;
	width: 8%;
	background-color: #9aa68e;
	border-radius: 999px;
	transition: width 0.18s ease;
}

#status-percent {
	font-size: 12px;
	color: #8b888d;
	letter-spacing: 0.04em;
}

#status-notice {
	display: none;
	background-color: #fdfbf7;
	border-radius: 8px;
	border: 1px solid #d5cebe;
	color: #55545b;
	line-height: 1.5;
	margin: 0 2rem;
	max-width: 520px;
	padding: 1rem 1.25rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
		<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
	</head>
	<body>
		<canvas id="canvas">
			您的浏览器不支持 HTML5 Canvas，请使用现代浏览器打开。
		</canvas>

		<noscript>
			请启用浏览器 JavaScript 以运行《已读》。
		</noscript>

		<div id="status">
			<div id="status-title">已读</div>
			<div id="status-subtitle">一段关于靠近、错过，以及重新开口的故事</div>
			<div id="status-progress-wrap">
				<div id="status-progress-bar"></div>
			</div>
			<div id="status-percent">正在载入绘本资源…</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":57212976,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgressWrap = document.getElementById('status-progress-wrap');
	const statusProgressBar = document.getElementById('status-progress-bar');
	const statusPercent = document.getElementById('status-percent');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgressWrap.style.display = mode === 'progress' ? 'block' : 'none';
		statusPercent.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('运行环境初始化失败，请刷新页面或使用桌面版体验。');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		const missingMsg = '当前浏览器缺少运行《已读》网页版所需的特性：\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const pct = Math.min(100, Math.round((current / total) * 100));
					statusProgressBar.style.width = Math.max(8, pct) + '%';
					statusPercent.textContent = '正在载入绘本与配乐资源… ' + pct + '%';
				} else {
					statusPercent.textContent = '正在载入绘本与配乐资源…';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			const cv = document.getElementById('canvas');
			if (cv) cv.focus();
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
